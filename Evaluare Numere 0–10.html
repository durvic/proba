/* Layout: panou de lucru cu 4 file (clasă, aplicare individuală, rezultate, propuneri); elevul vede doar ecranul mare cu itemul. */
:root{
  --bg:#f3f7fa;--surface:#ffffff;--surface2:#e8f0f6;--ink:#12263a;--muted:#546a80;--line:#d1dde8;
  --accent:#0b6e8a;--accent-ink:#ffffff;--accent-soft:#d6edf4;
  --ok:#1b7f55;--ok-soft:#d5efe2;--mid:#9a6200;--mid-soft:#faeac6;--low:#b23a2b;--low-soft:#f8d9d3;
  --ca:#0b8a8a;--cb:#3b62c4;--cc:#d9731a;--cd:#8a55b8;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --accent:#4cc3e0;--accent-ink:#06202a;--accent-soft:#14414f;
  --ok:#4cc790;--ok-soft:#16382b;--mid:#f0b84a;--mid-soft:#3b2f12;--low:#ff917e;--low-soft:#431f19;
  --ca:#3fc9c9;--cb:#86a2f2;--cc:#f2a15a;--cd:#c196e9;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1a26;--surface:#162636;--surface2:#1f3346;--ink:#e6eef5;--muted:#9db2c4;--line:#2b4256;
  --accent:#4cc3e0;--accent-ink:#06202a;--accent-soft:#14414f;
  --ok:#4cc790;--ok-soft:#16382b;--mid:#f0b84a;--mid-soft:#3b2f12;--low:#ff917e;--low-soft:#431f19;
  --ca:#3fc9c9;--cb:#86a2f2;--cc:#f2a15a;--cd:#c196e9;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);
  padding-block:0 3rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3{font-family:var(--fd);font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:clamp(1.5rem,4vw,2rem)}h2{font-size:1.35rem}h3{font-size:1.1rem}
p{margin:0}.muted{color:var(--muted)}.small{font-size:.875rem}
.top{padding-block:1.25rem .5rem;display:grid;gap:.25rem}
.sub{color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;justify-content:space-between;padding-block:.5rem}
.stor{font-size:.8125rem;color:var(--muted)}
select,input[type=number],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:.5rem .7rem;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
label.inl{display:inline-flex;align-items:center;gap:.5rem;font-weight:700}
.tabs{display:flex;gap:.25rem;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:1rem}
.tabs button{font:inherit;font-weight:800;background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;padding:.65rem 1rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{display:grid;gap:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;display:grid;gap:.75rem;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:1rem}
.btn{font:inherit;font-weight:800;border-radius:10px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:.55rem 1rem;cursor:pointer}

.btn.danger{border-color:var(--low);color:var(--low);background:transparent}
.btn.big{padding:.8rem 1.6rem;font-size:1.1rem}
.btn:disabled{opacity:.45;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.8rem 1rem}
.kpi b{display:block;font-family:var(--fd);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:.875rem}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:.45rem .6rem;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.8125rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:.3rem;border-radius:999px;padding:.1rem .6rem;font-size:.8125rem;font-weight:800;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.mid{background:var(--mid-soft);color:var(--mid)}.chip.low{background:var(--low-soft);color:var(--low)}
.chip.none{background:var(--surface2);color:var(--muted)}
.tag{font-size:.7rem;font-weight:800;background:var(--surface2);color:var(--muted);border-radius:6px;padding:.05rem .4rem;margin-left:.3rem}
.pills{display:flex;flex-wrap:wrap;gap:.4rem}
.pills button{font:inherit;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:.35rem .9rem;cursor:pointer}
.pills button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chbox{position:relative;width:100%}
.note{background:var(--accent-soft);border-radius:10px;padding:.6rem .8rem;font-size:.9rem}
.warn{background:var(--mid-soft);color:var(--ink);border-radius:10px;padding:.6rem .8rem;font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:10px;font-weight:700;z-index:20;max-width:92vw}
/* test: ecranul elevului */
.stage{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1rem;display:grid;gap:1rem;justify-items:center;text-align:center}
.prog{height:10px;background:var(--surface2);border-radius:99px;overflow:hidden;width:100%}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.q{font-family:var(--fd);font-size:clamp(1.4rem,4.5vw,2.1rem);font-weight:500;line-height:1.25;max-width:26ch}
.cue{width:100%;text-align:left;background:var(--accent-soft);border-radius:12px;padding:.6rem .9rem;font-size:.95rem}
.cue b{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.vis{width:min(100%,420px);height:auto}
.cell{fill:var(--surface2);stroke:var(--line);stroke-width:1.5}
.s-plain{fill:var(--cb);stroke:var(--cb);stroke-width:2;stroke-linejoin:round}
.s-on{fill:var(--cc);stroke:var(--cc);stroke-width:2;stroke-linejoin:round}
.s-off{fill:none;stroke:var(--muted);stroke-width:2.5;stroke-dasharray:5 4;stroke-linejoin:round}
.str{fill:none;stroke:var(--muted);stroke-width:2}
.bk{fill:var(--surface2);stroke:var(--ink);stroke-width:3;stroke-linejoin:round}
.eq{font-family:var(--fd);font-size:clamp(2rem,8vw,3.2rem);font-weight:500;letter-spacing:.05em}
.seq{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.seq span{font-family:var(--fd);font-size:clamp(2rem,8vw,3rem);min-width:3.4rem;padding:.2rem .6rem;border-radius:14px;background:var(--surface2)}
.seq span.qm{background:var(--accent);color:var(--accent-ink)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:.75rem;width:100%;max-width:560px}
.opt{font-family:var(--fd);font-size:clamp(2rem,9vw,3.2rem);min-height:92px;border-radius:18px;border:3px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.opt.wide{font-size:1.6rem}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt{position:relative}
.opt .bd{position:absolute;top:6px;right:10px;font-size:1rem;font-family:var(--fb);font-weight:800}
.tmark{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem;width:100%;max-width:560px}
.tmark .btn{padding:.9rem .8rem}
.big0{font-family:var(--fd);font-size:1.6rem;letter-spacing:.12em;color:var(--muted);word-break:break-word}
.fine{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:space-between;width:100%}
.abars{display:grid;gap:.6rem}
.ab{display:grid;grid-template-columns:minmax(120px,200px) 1fr auto;gap:.6rem;align-items:center}
.ab .tr{height:14px;background:var(--surface2);border-radius:99px;overflow:hidden}
.ab .tr i{display:block;height:100%;border-radius:99px}
.act{border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;display:grid;gap:.2rem;background:var(--surface)}
.act b{font-family:var(--fd);font-weight:600}
.act .m{font-size:.8125rem;color:var(--muted);font-weight:700}
.grp{display:grid;gap:.35rem}
.hm td,.hm th{text-align:center;padding:.3rem .35rem;font-size:.85rem}
.hm td.n{text-align:left;white-space:nowrap}
.hm .c1{background:var(--ok-soft);color:var(--ok);font-weight:800}
.hm .c5{background:var(--mid-soft);color:var(--mid);font-weight:800}
.hm .c0{background:var(--low-soft);color:var(--low);font-weight:800}
.hm th.A{border-bottom:3px solid var(--ca)}.hm th.B{border-bottom:3px solid var(--cb)}.hm th.C{border-bottom:3px solid var(--cc)}.hm th.D{border-bottom:3px solid var(--cd)}
details>summary{cursor:pointer;font-weight:800}
.dot{display:inline-block;width:.8rem;height:.8rem;border-radius:3px;margin-right:.4rem;vertical-align:-1px}
/* scena cu personaje */
.stage{position:relative;overflow:hidden;isolation:isolate;padding-bottom:6.5rem;background:linear-gradient(180deg,color-mix(in srgb,var(--ac,var(--accent)) 14%,var(--surface)),var(--surface) 70%)}
.stage>*{position:relative;z-index:1}
.stage>.scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:96px;z-index:0}
.scene .h1{fill:color-mix(in srgb,var(--ac) 34%,var(--surface))}
.scene .h2{fill:color-mix(in srgb,var(--ac) 18%,var(--surface))}
.stage>.sun{position:absolute;top:14px;right:18px;width:56px;height:56px;border-radius:50%;background:color-mix(in srgb,var(--ac) 30%,transparent);z-index:0}
.talk{display:flex;gap:1rem;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.chr{width:clamp(84px,22vw,132px);flex:none;animation:pop .35s ease-out}
.chr svg{display:block;width:100%;height:auto}
.chr.nod{animation:nod .4s ease-in-out}
.bubble{position:relative;background:var(--surface);border:3px solid var(--ac);border-radius:24px;padding:.7rem 1.1rem;max-width:32rem;text-align:left;flex:1 1 15rem}
.bubble::before{content:"";position:absolute;left:-11px;top:50%;width:18px;height:18px;margin-top:-9px;background:var(--surface);border-left:3px solid var(--ac);border-bottom:3px solid var(--ac);transform:rotate(45deg)}
.bubble .who{display:block;font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ac);filter:brightness(.85)}
.bubble .q{max-width:none;text-align:left}
.trail{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;max-width:30rem}
.trail i{display:block;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--c);background:transparent}
.trail i.done{background:var(--c)}
.trail i.cur{width:22px;height:22px;background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent)}
.stage .opt{border:3px solid var(--ac);background:var(--surface);color:var(--ink);border-radius:24px;box-shadow:0 5px 0 color-mix(in srgb,var(--ac) 55%,transparent);transition:transform .12s,box-shadow .12s}
.stage .opt:hover{transform:translateY(-2px)}
.stage .opt:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--ac) 55%,transparent)}
.stage .opt[aria-pressed=true]{background:var(--ac);color:var(--surface);border-color:var(--ac)}
.cast{display:flex;flex-wrap:wrap;gap:1rem 1.4rem;justify-content:center}
.cast figure{margin:0;display:grid;justify-items:center;gap:.2rem}
.cast .chr{width:92px;animation:none}
.cast figcaption{font-weight:800;font-size:.8125rem;color:var(--ink)}
.cf{position:absolute!important;top:-14px;width:9px;height:14px;border-radius:2px;opacity:.9;animation:fall 2.6s ease-in infinite;z-index:0!important}
@keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:scale(1);opacity:1}}
@keyframes nod{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg) translateY(-4px)}65%{transform:rotate(6deg)}}
@keyframes fall{to{transform:translateY(360px) rotate(420deg);opacity:0}}
@media (max-width:560px){.talk{flex-direction:column}.bubble::before{left:50%;top:-11px;margin:0 0 0 -9px;transform:rotate(135deg)}}
@media (prefers-reduced-motion:reduce){.chr,.chr.nod,.cf{animation:none}.cf{display:none}}
@media (max-width:560px){.ab{grid-template-columns:1fr auto}.ab .tr{grid-column:1/-1;order:3}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* ---------- Calcule ---------- */
function areaItems(a){return ITEMS.filter(function(i){return i.a===a})}
function pctArea(ev,a){var its=areaItems(a);return 100*its.reduce(function(t,i){return t+(ev.s[i.id]||0)},0)/its.length}
function pctTot(ev){return 100*ITEMS.reduce(function(t,i){return t+(ev.s[i.id]||0)},0)/ITEMS.length}
function lvl(p){return p>=S.T.ok?'ok':(p>=S.T.mid?'mid':'low')}
function chip(l){return '<span class="chip '+l+'">'+LV[l].s+' '+LV[l].n+'</span>'}
function evalSt(m){return S.elevi.filter(function(e){return e.ev&&e.ev[m]})}
function stu(id){return S.elevi.filter(function(e){return e.id===id})[0]}
function areaAvg(m){return AREAS.map(function(a){return avg(evalSt(m).map(function(e){return pctArea(e.ev[m],a.id)}))})}
function itemRate(m,it){return 100*avg(evalSt(m).map(function(e){return e.ev[m].s[it.id]||0}))}

function score(it,resp){
  if(it.t==='choice')return String(resp)===String(it.ans)?1:0;
  if(it.t==='order'){var r=String(resp).split(',').map(Number);if(r.join()===it.ans.join())return 1;return r[0]===it.ans[0]?.5:0}
  if(it.t==='multi'){var ch=String(resp)?String(resp).split('|'):[];var miss=it.ans.filter(function(x){return ch.indexOf(x)<0}).length;var extra=ch.filter(function(x){return it.ans.indexOf(x)<0}).length;var er=miss+extra;return er===0?1:(er===1?.5:0)}
  return Number(resp)
}

function renderStor(){

async function putStudent(st){
  var i=S.elevi.map(function(e){return e.id}).indexOf(st.id);
  if(i<0)S.elevi.push(st);else S.elevi[i]=st;
  sortEl(S.elevi);lsSet();
  if(db){try{var b=clone(st);delete b.id;await db.doc('elevi/'+st.id).set(b)}catch(e){toast('Nu s-a putut salva în cont. Doar proprietarul paginii poate modifica datele.')}}
}
async function delStudent(id){
  S.elevi=S.elevi.filter(function(e){return e.id!==id});lsSet();
  if(db){try{await db.doc('elevi/'+id).delete()}catch(e){toast('Nu s-a putut șterge din cont.')}}
}
function startDb(){
  if(!window.claude||!window.claude.use){S.stor='local';renderStor();return}
  var tm=setTimeout(function(){if(S.stor==='init'){S.stor='slow';renderStor()}},10000);
  window.claude.use('db').then(function(d){
    if(!d){clearTimeout(tm);S.stor='local';renderStor();return}
    db=d;
    db.collection('elevi').onSnapshot(function(snap){
      if(!snap.metadata.fromCache)clearTimeout(tm);
      S.elevi=sortEl(snap.docs.map(function(x){var o=clone(x.data());o.id=x.id;return o}));
      S.stor='db';lsSet();renderStor();refresh()
    },function(){clearTimeout(tm);S.stor='local';renderStor()})
  }).catch(function(){clearTimeout(tm);S.stor='local';renderStor()})
}

function starPts(cx,cy,R){var p=[];for(var i=0;i<10;i++){var r=i%2?R*.45:R,a=-Math.PI/2+i*Math.PI/5;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1))}return p.join(' ')}
function shp(k,cx,cy,st){
  if(k==='star')return '<polygon class="s-'+st+'" points="'+starPts(cx,cy,22)+'"/>';
  if(k==='balloon')return '<g><ellipse class="s-'+st+'" cx="'+cx+'" cy="'+(cy-5)+'" rx="15" ry="19"/><path class="str" d="M'+cx+' '+(cy+14)+' q-5 6 0 12"/></g>';
  if(k==='acorn')return '<g><ellipse class="s-'+st+'" cx="'+cx+'" cy="'+(cy+4)+'" rx="11" ry="14"/><path class="s-'+st+'" d="M'+(cx-15)+' '+(cy-4)+'q15-18 30 0z"/><path class="str" d="M'+cx+' '+(cy-14)+'v-6"/></g>';
  return '<circle class="s-'+st+'" cx="'+cx+'" cy="'+cy+'" r="14"/>'
}
function vis(v){
  if(!v)return '';
  var alt=esc(v.alt||'');
  if(v.k==='seq')return '<div class="seq" role="img" aria-label="Șir de numere cu un număr lipsă">'+v.seq.map(function(x){return '<span'+(x==='?'?' class="qm"':'')+'>'+x+'</span>'}).join('')+'</div>';
  if(v.k==='eq')return '<div class="eq">'+esc(v.eq)+'</div>';
  if(v.k==='basket')return '<svg class="vis" viewBox="0 0 320 150" role="img" aria-label="Un coș gol"><path class="bk" d="M85 62h150l-16 74H101z"/><path class="bk" d="M115 62c0-46 90-46 90 0" fill="none"/></svg>';
  if(v.k==='scatter'){
    var P=[[34,34],[100,24],[166,46],[232,26],[284,58],[48,106],[112,118],[178,102],[238,120],[290,106]],O=[0,6,3,8,1,5,9,2,7,4],s='';
    for(var i=0;i<v.n;i++){var q=P[O[i]];s+=shp(v.shape,q[0],q[1],'plain')}
    return '<svg class="vis" viewBox="0 0 320 150" role="img" aria-label="'+alt+'">'+s+'</svg>'
  }
  if(v.k==='frame'){
    var t='';
    for(var j=0;j<10;j++){var cx=34+(j%5)*58,cy=40+Math.floor(j/5)*62;t+='<rect class="cell" x="'+(cx-26)+'" y="'+(cy-26)+'" width="52" height="52" rx="8"/>';if(j<v.n)t+=shp(v.shape,cx,cy,j<v.on?'on':'off')}
    return '<svg class="vis" viewBox="0 0 320 132" role="img" aria-label="'+alt+'">'+t+'</svg>'+(v.eq?'<div class="eq">'+esc(v.eq)+'</div>':'')
  }
  return ''
}

function startRun(){
  var id=($('selStu')||{}).value||S.sel;if(!id)return;

}
function advance(resp){
  var r=S.run,it=ITEMS[r.i];
  r.a[it.id]=String(resp);r.s[it.id]=score(it,resp);r.multi=[];r.order=[];
  r.i++;S.busy=false;
  if(r.i>=ITEMS.length){finishRun();return}
  renderTest()
}
async function finishRun(){
  var r=S.run,st=clone(stu(r.id));if(!st.ev)st.ev={};
  st.ev[r.moment]={data:today(),s:r.s,a:r.a};
  r.done=true;await putStudent(st);renderTest();refresh()
}
function nextStudent(){

  S.run=null;if(nx){S.sel=nx.id;renderTest()}else{toast('Toți elevii au fost evaluați la acest moment.');S.tab='rez';showTab()}
}

  var ta=areaAvg(m),ord=AREAS.map(function(a,i){return {a:a,p:ta[i]}}).sort(function(x,y){return x.p-y.p});
  var best=ord[ord.length-1],worst=ord[0];
  h+='<div class="card"><h2>Pentru toată clasa</h2><p>La momentul „'+esc(m)+'” au fost evaluați <b>'+ev.length+'</b> elevi. Cea mai bine stăpânită arie este <b>'+best.a.nume+'</b> ('+Math.round(best.p)+'%), iar cea mai fragilă este <b>'+worst.a.nume+'</b> ('+Math.round(worst.p)+'%).</p></div>';
  h+='<div class="grid2">';
  ord.forEach(function(o){
    var l=lvl(o.p),weak=areaItems(o.a.id).filter(function(it){return itemRate(m,it)<70});
    h+='<div class="card"><div class="row" style="justify-content:space-between"><h3><i class="dot" style="background:var('+o.a.col+')"></i>'+o.a.nume+'</h3>'+chip(l)+'</div><p class="small muted">Media clasei: '+Math.round(o.p)+'%</p>';
    h+=l==='ok'?'<p class="small">Aria este stăpânită de clasă. Păstreaz-o vie cu un joc scurt de consolidare, o dată pe săptămână, sau oferă extindere celor care termină repede.</p>':'<p class="small">Propunere: 2 jocuri de câte 5–8 minute, de 3 ori pe săptămână, timp de două săptămâni, apoi mini-verificare orală pe itemii slabi.</p>';
    h+=actsFor(o.a.id,l).map(actHTML).join('');
    if(weak.length)h+='<p class="small"><b>Itemi de reverificat:</b> '+weak.map(function(it){return esc(it.short)+' ('+Math.round(itemRate(m,it))+'%)'}).join('; ')+'.</p>';
    h+='</div>'
  });
  h+='</div>';
  var fi=ITEMS.filter(function(it){return itemRate(m,it)<60}).sort(function(a,b){return itemRate(m,a)-itemRate(m,b)});
  h+='<div class="card"><h2>Greșeli frecvente și ce poți face</h2>';
  if(!fi.length)h+='<p class="muted">Niciun item nu are o reușită sub 60%.</p>';
  else h+='<div class="grp">'+fi.map(function(it){
    var w={};ev.forEach(function(e){var r=e.ev[m];if((r.s[it.id]||0)<1&&r.a&&r.a[it.id]!==undefined)w[r.a[it.id]]=(w[r.a[it.id]]||0)+1});
    var top=Object.keys(w).sort(function(a,b){return w[b]-w[a]})[0],dg=top&&it.diag&&it.diag[top]&&w[top]>=2?' Cea mai frecventă greșeală: răspunsul „'+esc(top)+'” ('+w[top]+' elevi) — '+esc(it.diag[top])+'.':'';
    return '<div class="act"><b>'+esc(it.short)+' · '+Math.round(itemRate(m,it))+'%</b><span class="small">'+dg+' '+esc(it.hint)+'</span></div>'}).join('')+'</div>';
  h+='</div>';
  h+='<div class="card"><h2>Grupe de lucru</h2><p class="small muted">Formate după nivelul pe fiecare arie. Un elev poate apărea în mai multe grupe.</p><div class="grid2">';
  AREAS.forEach(function(a){
    var lo=ev.filter(function(e){return lvl(pctArea(e.ev[m],a.id))==='low'}),mi=ev.filter(function(e){return lvl(pctArea(e.ev[m],a.id))==='mid'});
    h+='<div class="grp"><b><i class="dot" style="background:var('+a.col+')"></i>'+a.nume+'</b><span class="small"><b>Sprijin:</b> '+names(lo)+'</span><span class="small"><b>Consolidare:</b> '+names(mi)+'</span></div>'
  });
  var top2=ev.filter(function(e){return AREAS.every(function(a){return lvl(pctArea(e.ev[m],a.id))==='ok'})});
  h+='<div class="grp"><b>Grupa de extindere</b><span class="small">Atins la toate ariile: '+names(top2)+'</span></div></div></div>';
  h+='<div class="card"><h2>Fișa unui elev</h2><label class="inl" for="propStu">Elev <select id="propStu">'+ev.map(function(e){return '<option value="'+e.id+'"'+(e.id===S.sel?' selected':'')+'>'+esc(e.nume)+'</option>'}).join('')+'</select></label><div id="fiche"></div></div>';
  $('p-prop').innerHTML=h;
  var sid=$('propStu');if(sid){if(!ev.some(function(e){return e.id===S.sel}))S.sel=ev[0].id;sid.value=S.sel;renderFiche()}
}
function descr(st,ev){
  var parts=[];
  AREAS.forEach(function(a){
    var l=lvl(pctArea(ev,a.id));
    if(l==='ok')parts.push('la '+a.nume.toLowerCase()+', '+a.desc+' în mod sigur');
    else if(l==='mid')parts.push('la '+a.nume.toLowerCase()+', este în curs de consolidare ('+a.desc+' cu mici ezitări)');
    else parts.push('la '+a.nume.toLowerCase()+', are nevoie de sprijin și exerciții cu obiecte concrete');
  });
  return st.nume+': '+parts.join('; ')+'. Se recomandă continuarea activităților de joc cu material concret, urmate de mini-verificări orale.'
}
function renderFiche(){
  var m=S.moment,st=stu(S.sel),h='';
  if(!st||!st.ev||!st.ev[m]){$('fiche').innerHTML='';return}
  var ev=st.ev[m];
  h+='<h3 style="margin-top:.5rem">'+esc(st.nume)+' · '+esc(m)+' · '+esc(ev.data||'')+'</h3><div class="abars">';
  AREAS.forEach(function(a){var p=pctArea(ev,a.id);h+='<div class="ab"><span><i class="dot" style="background:var('+a.col+')"></i>'+a.nume+'</span><div class="tr"><i style="width:'+p+'%;background:var('+a.col+')"></i></div><span>'+Math.round(p)+'% '+chip(lvl(p))+'</span></div>'});
  h+='</div>';
  var miss=ITEMS.filter(function(it){return (ev.s[it.id]||0)<1});
  h+=miss.length?'<div><b>Itemi de reluat:</b><ul class="small">'+miss.map(function(it){var r=ev.a&&ev.a[it.id],d=it.diag&&it.diag[r];return '<li>'+esc(it.short)+((ev.s[it.id]||0)>0?' (parțial)':'')+(d?' — '+esc(d):'')+'</li>'}).join('')+'</ul></div>':'<p>Toți itemii au fost rezolvați corect.</p>';
  var need=AREAS.filter(function(a){return lvl(pctArea(ev,a.id))!=='ok'}).map(function(a){return {a:a,l:lvl(pctArea(ev,a.id))}});
  h+='<h3>Plan individual de sprijin</h3>';
  h+=need.length?'<div class="grid2">'+need.map(function(x){return '<div class="grp"><b><i class="dot" style="background:var('+x.a.col+')"></i>'+x.a.nume+'</b>'+actsFor(x.a.id,x.l).map(actHTML).join('')+'</div>'}).join('')+'</div>':'<div class="grid2">'+actHTML(BANK.C[3])+actHTML(BANK.D[3])+'</div><p class="small muted">Elevul a atins toate ariile: poate primi activități de extindere.</p>';
  h+='<h3>Text pentru raportul descriptiv</h3><textarea id="rep" rows="5" readonly>'+esc(descr(st,ev))+'</textarea><div class="row"><button class="btn ghost" data-act="copy">Copiază textul</button></div>';
  h+='<label for="obs" class="small" style="font-weight:700">Observațiile mele (se salvează automat)</label><textarea id="obs" rows="3" placeholder="Atenție, ritm de lucru, strategii observate…">'+esc(ev.obs||'')+'</textarea>';
  $('fiche').innerHTML=h
}

/* ---------- Date demonstrative, export, import ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genEv(rand,theta){
  var D={n1:-1.6,n2:-.6,n3:-1,n4:0,n5:-.5,n6:.4,o1:-1,o2:0,o3:.2,o4:.4,d1:-.5,d2:.2,d3:.8,d4:1.1,d5:1.4,p1:.3,p2:1.1},s={},a={};
  ITEMS.forEach(function(it){
    var pr=1/(1+Math.exp(-(theta-D[it.id]))),ok=rand()<pr;
    if(it.t==='oral'){s[it.id]=ok?1:(rand()<.5?.5:0);a[it.id]=String(s[it.id])}
    else if(it.t==='choice'){if(ok){a[it.id]=String(it.ans);s[it.id]=1}else{var ks=it.diag?Object.keys(it.diag):[],w=ks.length&&rand()<.65?ks[Math.floor(rand()*ks.length)]:String(it.ch.filter(function(c){return c!==it.ans})[Math.floor(rand()*(it.ch.length-1))]);a[it.id]=w;s[it.id]=0}}
    else if(it.t==='order'){if(ok){a[it.id]=it.ans.join();s[it.id]=1}else{a[it.id]='2,9,4';s[it.id]=.5}}
    else{if(ok){a[it.id]=it.ans.join('|');s[it.id]=1}else{a[it.id]='3 + 5|6 + 3';s[it.id]=0}}
  });
  return {data:today(),s:s,a:a}
}
async function loadDemo(){
  if(S.busy)return;S.busy=true;toast('Se încarcă datele demonstrative…');
  var r=rng(2026),room=30-S.elevi.length,N=Math.min(24,room);
  for(var i=0;i<N;i++){
    var th=(r()+r()+r()-1.5)*2.2+0.1,id=newId();
    var st={id:id,nume:'Demo '+(i<9?'0':'')+(i+1),demo:true,creat:today(),ev:{}};
    st.ev['Inițială']=genEv(r,th);st.ev['Finală']=genEv(r,th+1);
    await putStudent(st)
  }
  S.busy=false;refresh();toast('Clasa demonstrativă este încărcată.')
}
async function delDemo(){
  var ids=S.elevi.filter(function(e){return e.demo}).map(function(e){return e.id});
  for(var i=0;i<ids.length;i++)await delStudent(ids[i]);
  refresh();toast('Datele demo au fost șterse.')
}
function csv(){
  var rows=[['Elev','Moment','Data'].concat(ITEMS.map(function(i){return i.id}),AREAS.map(function(a){return '% '+a.scurt}),['% Total','Nivel'])];
  S.elevi.forEach(function(st){MOMENTE.forEach(function(m){var e=st.ev&&st.ev[m];if(!e)return;rows.push([st.nume,m,e.data||''].concat(ITEMS.map(function(i){return e.s[i.id]===undefined?'':e.s[i.id]}),AREAS.map(function(a){return Math.round(pctArea(e,a.id))}),[Math.round(pctTot(e)),LV[lvl(pctTot(e))].n]))})});
  return '﻿'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(';')}).join('\r\n')
}
async function save(name,data){
  try{
    var d=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(!d){toast('Descărcarea nu este disponibilă în această vizualizare.');return}
    await d.save({filename:name,data:data});toast('Fișier salvat.')
  }catch(e){if(!e||e.code!=='declined')toast('Fișierul nu a putut fi salvat.')}
}
async function importFile(f){
  try{
    var o=JSON.parse(await f.text()),list=Array.isArray(o)?o:o.elevi;
    if(!Array.isArray(list))throw 0;
    var room=30-S.elevi.length,n=0;
    for(var i=0;i<list.length&&n<room;i++){var x=list[i];if(!x||!x.nume)continue;x.id=newId();if(!x.ev)x.ev={};await putStudent(x);n++}
    refresh();toast(n+' elevi importați.')
  }catch(e){toast('Fișierul nu este o copie validă.')}
}
async function addNames(){
  var ta=$('names'),lines=ta.value.split('\n').map(function(s){return s.trim()}).filter(Boolean),room=30-S.elevi.length;
  if(!lines.length){toast('Scrie cel puțin un nume.');return}
  var take=lines.slice(0,room);
  for(var i=0;i<take.length;i++)await putStudent({id:newId(),nume:take[i].slice(0,40),creat:today(),ev:{}});
  if(lines.length>room)toast('Clasa are maximum 30 de elevi. Au fost adăugați '+take.length+'.');
  refresh()
}

/* ---------- Navigare și evenimente ---------- */
function showTab(){
  ['clasa','test','rez','prop'].forEach(function(t){$('p-'+t).hidden=S.tab!==t});
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){b.setAttribute('aria-selected',String(b.dataset.v===S.tab))});
  if(S.tab==='rez')drawChart();
  window.scrollTo(0,0)
}
function refresh(){renderStor();renderClasa();if(!S.run)renderTest();renderRez();renderProp()}

document.addEventListener('click',async function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,v=b.dataset.v,r=S.run;
  if(a==='tab'){S.tab=v;showTab();return}
  if(a==='add'){await addNames();return}
  if(a==='go'){S.sel=b.dataset.id;S.run=null;S.tab='test';renderTest();showTab();return}
  if(a==='del'){S.confirmDel=b.dataset.id;renderClasa();return}
  if(a==='delno'){S.confirmDel=null;renderClasa();return}
  if(a==='delyes'){var id=S.confirmDel;S.confirmDel=null;await delStudent(id);refresh();return}
  if(a==='demo'){await loadDemo();return}
  if(a==='demodel'){await delDemo();return}
  if(a==='expcsv'){save('rezultate-numere-0-10.csv',csv());return}
  if(a==='expjson'){save('copie-numere-0-10.json',JSON.stringify({v:1,elevi:S.elevi}));return}
  if(a==='imp'){$('file').click();return}
  if(a==='start'){startRun();return}
  if(a==='chart'){S.chart=v;renderRez();return}
  if(a==='copy'){var t=$('rep');try{await navigator.clipboard.writeText(t.value);toast('Text copiat.')}catch(e){t.removeAttribute('readonly');t.select();toast('Selectat. Apasă Ctrl+C pentru a copia.')}return}
  if(a==='next'){nextStudent();return}
  if(a==='home'){S.run=null;S.tab='clasa';refresh();showTab();return}
  if(a==='fiche'){S.sel=r.id;S.run=null;S.tab='prop';refresh();showTab();return}
  if(!r||r.done)return;
  var it=ITEMS[r.i];
  if(a==='pick'){if(S.busy)return;S.busy=true;var cc=$('chr');if(cc)cc.classList.add('nod');Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(o){o.setAttribute('aria-pressed',String(o===b))});setTimeout(function(){advance(v)},450);return}
  if(a==='oral'){advance(v);return}
  if(a==='order'){var n=Number(v);if(r.order.indexOf(n)<0)r.order.push(n);if(r.order.length===it.items.length){renderTest();setTimeout(function(){advance(r.order.join(','))},450)}else renderTest();return}
  if(a==='orderclear'){r.order=[];renderTest();return}
  if(a==='mtoggle'){var k=r.multi.indexOf(v);if(k>=0)r.multi.splice(k,1);else r.multi.push(v);renderTest();return}
  if(a==='mdone'){advance(r.multi.join('|'));return}
  if(a==='back'){if(r.i>0){r.i--;r.multi=[];r.order=[];S.busy=false;renderTest()}return}
  if(a==='skip'){r.a[it.id]='—';r.s[it.id]=0;r.multi=[];r.order=[];r.i++;S.busy=false;if(r.i>=ITEMS.length)finishRun();else renderTest();return}
  if(a==='stop'){S.confirmStop=true;renderTest();return}
  if(a==='stopno'){S.confirmStop=false;renderTest();return}
  if(a==='stopyes'){S.run=null;S.confirmStop=false;S.busy=false;renderTest();return}
});
document.addEventListener('change',async function(e){
  var t=e.target;
  if(t.id==='moment'){S.moment=t.value;S.run=null;refresh();return}
  if(t.id==='selStu'){S.sel=t.value;return}
  if(t.id==='rezStu'){S.sel=t.value||null;drawChart();return}
  if(t.id==='propStu'){S.sel=t.value;renderFiche();return}
  if(t.id==='thOk'||t.id==='thMid'){
    var ok=Number($('thOk').value),mid=Number($('thMid').value);
    if(ok>mid&&mid>0&&ok<=100){S.T={ok:ok,mid:mid};thSet();refresh()}else{toast('Pragul „Atins” trebuie să fie mai mare decât pragul „În dezvoltare”.');renderClasa()}
    return
  }
  if(t.id==='file'&&t.files&&t.files[0]){await importFile(t.files[0]);t.value='';return}
  if(t.id==='obs'){
    var st=stu(S.sel);if(st&&st.ev&&st.ev[S.moment]){st=clone(st);st.ev[S.moment].obs=t.value;await putStudent(st);toast('Observațiile au fost salvate.')}
  }
});

$('moment').innerHTML=MOMENTE.map(function(m){return '<option>'+m+'</option>'}).join('');
thGet();S.elevi=sortEl(lsGet());
if(S.elevi.length)S.sel=S.elevi[0].id;
refresh();showTab();startDb();
try{
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(S.tab==='rez')drawChart()});
  new MutationObserver(function(){if(S.tab==='rez')drawChart()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']})
}catch(e){}
})();
</script>
